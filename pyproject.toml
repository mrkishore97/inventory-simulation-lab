[project]
name = "inventory-twin"
version = "0.1.0"
description = "Interactive inventory policy simulator with Gymnasium-compatible API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kishore Kumar Shanmugam", email = "mrkishore000@gmail.com" }]
dependencies = [
    "gymnasium>=1.3.0",
    "joblib>=1.5.3",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "streamlit>=1.56.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.152.4",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.12",
    "types-pyyaml>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "policies", "demand", "leadtime", "scenarios", "analytics", "recommender", "visualization", "ui", "inventory_twin"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["core", "policies", "demand", "leadtime", "analytics", "recommender", "experiments", "visualization", "inventory_twin"]
omit = ["tests/*", "ui/*", "notebooks/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
