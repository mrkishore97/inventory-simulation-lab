# Reference Empirical demand scenario for the chassis.
# Reproduces with: python -m inventory_twin.cli run --config data/scenarios/example_m5_smooth.yaml
#
# Empirical (IID resample) demand on top of a bundled "fast-moving smooth"
# archetype sample. The history file is data/m5/sample_smooth.parquet:
# 1825 rows (5 years daily), single 'demand' column, generated by
# scripts/generate_m5_sample.py from Normal(10, 2) clipped at 0 with
# master_seed=42.
#
# ** The "M5" label in the directory name is aspirational **
# The bundled history is SYNTHETIC (Normal(10, 2)-shaped), not real
# Walmart M5 competition data. Real M5 SKUs swap in via the archetype
# curation. The synthetic chassis sample exists so the
# empirical demand chassis is exercisable end-to-end with hermetic tests
# (no network, no external dataset, no legal redistribution questions)
# and the resulting policy outcome is verifiable against the established
# Normal(10, 2) cost baseline of $5,562.05.
#
# Expected cost behavior vs example.yaml ($5,562.05 Stationary Normal(10, 2)
# baseline): WITHIN ±20%. The bundled history IS Normal(10, 2) (clipped),
# so the empirical resampling reproduces the same marginal distribution
# the parametric NormalDemand would produce. Cost is not bit-identical
# because the RNG access pattern differs (rng.choice(history) vs
# rng.normal(mean, std)) → different sample sequences → different
# policy-trigger dynamics → slightly different cost. The locked
# integration test `test_engine_empirical_demand_close_to_normal_baseline`
# is the chassis-correctness gate (a wildly-off cost signals a bug).
#
# Path resolution: history_path is interpreted relative to the current
# working directory at engine __init__ time. Run from the repo root
# (where this YAML's path is data/scenarios/example_m5_smooth.yaml) and
# the engine resolves data/m5/sample_smooth.parquet correctly.
#
# Determinism caveat: this config's hash includes history_path but NOT
# the file contents. Treating the bundled parquet as an immutable artifact
# preserves the determinism contract; mutating it silently changes the
# demand stream without changing the hash.
name: m2-bullet15-empirical-smooth-chassis
notes: Empirical demand chassis demo on a bundled SYNTHETIC 'smooth' sample (Normal(10,2)). This is the hermetic chassis-correctness fixture (known baseline). Real M5 archetypes landed in Bullet 16 — see example_archetype_{smooth,intermittent,seasonal,promotional}.yaml and data/m5/archetypes_manifest.json.
master_seed: 42
simulation:
  horizon: 90
  initial_on_hand: 100
  initial_on_order: 0
  backorder_policy: backorder
demand:
  kind: empirical
  history_path: data/m5/sample_smooth.parquet
lead_time:
  kind: deterministic
  lead_time: 3
policy:
  kind: sQ
  reorder_point: 20.0
  order_quantity: 30
costs:
  unit_cost: 5.0
  holding_per_unit_per_period: 0.5
  ordering_fixed: 20.0
  backorder_per_unit_per_period: 2.0
  lost_sale_per_unit: 0.0
