# Reference scenario — Gamma (stochastic) lead time.
# Reproduce: python -m inventory_twin.cli run --config data/scenarios/example_leadtime_gamma.yaml
#
# Identical to example.yaml (the deterministic-lead-time-3 baseline, cost
# $5,562.05) EXCEPT the lead time is stochastic and Gamma-distributed: each
# order's arrival delay is drawn from Gamma(shape=9, scale=1/3), rounded to the
# nearest whole period and clipped to >= 1 via the shared round_to_periods
# helper — i.e. arrival_t = t + max(1, round(Gamma(9, 1/3))).
#
# Gamma(shape=9, scale=0.3333) has mean = 9 * (1/3) = 3 and variance =
# 9 * (1/3)^2 = 1 (std = 1) — deliberately MATCHED to the Normal(mean=3, std=1)
# lead-time scenario's first two moments. With the mean and variance held equal,
# the cost difference vs example_leadtime_normal.yaml ($5,934.37) isolates the
# effect of Gamma's right-skew (a heavier upper tail of late deliveries) against
# the symmetric Normal — the same matched-moment comparison the demand axis uses
# (NegBin/Gamma/Lognormal at mean=10, var=20). Gamma is the textbook delivery-
# delay distribution: strictly positive, right-skewed.
#
# Expected cost behavior: somewhat higher than the deterministic-L3 baseline
# ($5,562.05) because lead-time variability adds replenishment risk. The exact
# value is observed on the lead-time cost axis; it is not asserted
# in tests (same convention as the distribution / pattern / M5 axes).
name: m2-bullet20-leadtime-gamma
notes: Gamma(shape=9, scale=1/3) stochastic lead time on the (s,Q) baseline (mean 3, std 1 — matched to the Normal lead-time scenario's moments). Per-order delay = max(1, round(Gamma(9, 1/3))). Second stochastic lead-time arm.
master_seed: 42
simulation:
  horizon: 90
  initial_on_hand: 100
  initial_on_order: 0
  backorder_policy: backorder
demand:
  kind: normal
  mean: 10.0
  std: 2.0
lead_time:
  kind: gamma
  shape: 9.0
  scale: 0.3333333333
policy:
  kind: sQ
  reorder_point: 20.0
  order_quantity: 30
costs:
  unit_cost: 5.0
  holding_per_unit_per_period: 0.5
  ordering_fixed: 20.0
  backorder_per_unit_per_period: 2.0
  lost_sale_per_unit: 0.0
