# Reference scenario — Lognormal (stochastic) lead time.
# Reproduce: python -m inventory_twin.cli run --config data/scenarios/example_leadtime_lognormal.yaml
#
# Identical to example.yaml (the deterministic-lead-time-3 baseline, cost
# $5,562.05) EXCEPT the lead time is stochastic and Lognormal-distributed: each
# order's arrival delay is drawn from Lognormal(mu=1.045931, sigma=0.324593),
# rounded to the nearest whole period and clipped to >= 1 via the shared
# round_to_periods helper — i.e. arrival_t = t + max(1, round(Lognormal(mu, sigma))).
#
# ** PARAMETER FOOT-GUN ** mu and sigma are the parameters of the UNDERLYING
# Normal, NOT the mean/std of the resulting lead time. A reader must not read
# "mu: 1.046" as "mean lead time 1.05". The resulting moments are:
#   E[X]   = exp(mu + sigma^2/2)
#   Var[X] = (exp(sigma^2) - 1) * exp(2*mu + sigma^2)
#
# These parameters are solved to give mean = 3, variance = 1 (std = 1) —
# DELIBERATELY MATCHED to the Normal(mean=3, std=1) and Gamma(shape=9, scale=1/3)
# lead-time scenarios. With mean and variance held equal across all three
# stochastic arms, the cost differences isolate distribution SHAPE (tail
# heaviness) at fixed first-two-moments — the same matched-moment comparison the
# demand axis uses (NegBin/Gamma/Lognormal at mean=10, var=20). Derivation:
#   sigma^2 = ln(1 + var/mean^2) = ln(1 + 1/9) = ln(10/9) = 0.105361
#   sigma   = 0.324593
#   mu      = ln(3) - sigma^2/2 = 1.098612 - 0.052680 = 1.045931
#
# Expected cost behavior: higher than the deterministic-L3 baseline ($5,562.05)
# because lead-time variability adds replenishment risk. Observed
# on the lead-time cost axis; not asserted in tests (same convention as the
# distribution / pattern / M5 axes).
name: m2-bullet21-leadtime-lognormal
notes: Lognormal(mu=1.045931, sigma=0.324593) stochastic lead time on the (s,Q) baseline (mean 3, std 1 — matched to the Normal & Gamma lead-time scenarios). mu/sigma are the UNDERLYING Normal's params, not the resulting moments. Third/final stochastic lead-time arm.
master_seed: 42
simulation:
  horizon: 90
  initial_on_hand: 100
  initial_on_order: 0
  backorder_policy: backorder
demand:
  kind: normal
  mean: 10.0
  std: 2.0
lead_time:
  kind: lognormal
  mu: 1.045931
  sigma: 0.324593
policy:
  kind: sQ
  reorder_point: 20.0
  order_quantity: 30
costs:
  unit_cost: 5.0
  holding_per_unit_per_period: 0.5
  ordering_fixed: 20.0
  backorder_per_unit_per_period: 2.0
  lost_sale_per_unit: 0.0
