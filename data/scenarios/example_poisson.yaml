# Reference Poisson-demand scenario.
# Reproduces with: python -m inventory_twin.cli run --config data/scenarios/example_poisson.yaml
name: m2-poisson-baseline
notes: Reference Poisson(rate=10) demand baseline — integer-valued demand stream, otherwise mirrors example.yaml for cost-comparison parity.
master_seed: 42
simulation:
  horizon: 90
  initial_on_hand: 100
  initial_on_order: 0
  backorder_policy: backorder
demand:
  kind: poisson
  rate: 10.0
lead_time:
  kind: deterministic
  lead_time: 3
policy:
  kind: sQ
  reorder_point: 20.0
  order_quantity: 30
costs:
  unit_cost: 5.0
  holding_per_unit_per_period: 0.5
  ordering_fixed: 20.0
  backorder_per_unit_per_period: 2.0
  lost_sale_per_unit: 0.0
